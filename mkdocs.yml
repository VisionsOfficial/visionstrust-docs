site_name: VisionsTrust Documentation
site_description: Documentation for VisionsTrust Application & API
site_author: Visions
docs_dir: docs
site_dir: ./site
use_directory_urls: false
site_url: https://docs.visionstrust.com
# repo_url: https://github.com/VisionsOfficial/visionstrust-docs
# edit_uri: blob/main/docs/
copyright: Visions 2025
plugins:
  - search
  - mermaid2
  - macros
  - git-revision-date-localized:
      fallback_to_build_date: true
      locale: en
      timezone: Europe/Paris
extra:
  app_name: VisionsTrust
  pdc_config_catalog_uri: https://api.visionstrust.com/v1/
  pdc_config_contract_uri: https://contract.visionstrust.com/
  pdc_config_consent_uri: https://consent.visionstrust.com/v1
  settings_url: https://visionstrust.com/dashboard/profile/settings
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
theme:
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  name: material
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.footer
    - search.highlight
    - search.share

nav: 
  - Home: index.md
  - Glossary: glossary.md
  - Application:
    - Getting Started:
      - Overview: application/overview.md
      - Onboarding: application/onboarding.md
      - Dashboard: application/dashboard.md
    - Discovery: 
      - Browsing: application/discovery/index.md
      - Offers: application/discovery/offers.md
      - Projects: application/discovery/projects.md
      - Infrastructure Offers: application/discovery/infrastructure.md
    - Offers:
      - Overview: application/registering-resources/overview.md
      - Creating an offer: application/registering-resources/creating-an-offer.md
      - Data Resource: application/registering-resources/data-resources.md
      - Service Resource: application/registering-resources/service-resources.md
      - Infrastructure Offers: application/registering-resources/infrastructure-offers.md
      - Tips and Tricks: application/registering-resources/tips-and-tricks.md
    - Projects:
      - Overview: application/projects/overview.md
      - Creating a Project: application/projects/creating-a-project.md
      - Project Settings: application/projects/project-settings.md
      - Contributions: application/projects/contributions.md
      - Service Chains: application/projects/service-chains.md
    - Negotiation:
      # - Peer-to-Peer: application/negotiation/peer-to-peer.md
      - Project Negotiation: application/negotiation/project-negotiation.md
      - Invitations: application/negotiation/invitations.md
      - Join Requests: application/negotiation/join-requests.md
      - Negotiation Process: application/negotiation/negotiation.md
  - Developers:
    - Guide: guide/guide.md
    - Requirements: guide/requirements.md
    - Setting up a connector: guide/setting-up-a-connector.md
    - Setting up resources: guide/setting-up-technical-resources.md
    - Integrating consent: guide/setting-up-for-consent.md
    - API Consumption: guide/api-consumption-flow.md
    - Testing: guide/testing.md
  - Settings:
    - Settings Access: settings/settings-access.md
    - Admin Management: settings/admin-access.md
    - API Keys: settings/api-keys.md
    - Visibility: settings/visibility.md
  - Tutorial Videos: tutorial-videos.md