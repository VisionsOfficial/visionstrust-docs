      - Adjust the baseline: application/basket/adjusting-the-baseline.md  
    - Negotiation:
      - Overview: application/negotiation/project-negotiation.md
      - Invite offers: application/negotiation/invitations.md
      - Join a project: application/negotiation/join-requests.md
      - Review a negotiation: application/negotiation/negotiation.md
      - Restart a negotiation: application/negotiation/restarting-a-negotiation.md
